<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>デジタル暗記ノートアプリ (PDF対応版)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        .canvas-container {
            position: relative;
            margin: 0 auto;
            display: block;
        }
        #originalCanvas {
            display: block;
            margin: 0 auto;
            object-fit: contain;
        }
        #maskCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        
        /* 全体表示モード（初期状態） */
        .zoom-fit #originalCanvas {
            max-width: 100%;
            max-height: 65vh;
            width: auto;
            height: auto;
        }
        
        /* 拡大モード（制限を解除して自由スクロール） */
        .zoom-custom #originalCanvas {
            max-width: none;
            max-height: none;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans">

    <header class="bg-indigo-600 text-white shadow-md p-4 sticky top-0 z-10 flex justify-between items-center">
        <h1 class="text-xl font-bold flex items-center gap-2">
            <span>📝</span> デジタル暗記ノート
        </h1>
        <button id="btnNewNote" class="bg-white text-indigo-600 font-bold px-4 py-2 rounded-full shadow hover:bg-indigo-50 transition-all text-sm flex items-center gap-1">
            ➕ 新規ノート
        </button>
    </header>

    <main class="max-w-5xl mx-auto p-4 md:p-6">
        
        <section id="screenList">
            <h2 class="text-lg font-bold mb-4 text-slate-700 flex items-center gap-2">
                🗂 保存されたノート一覧
            </h2>
            <div id="noteGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>
            <div id="emptyState" class="hidden text-center py-12 text-slate-400">
                <p class="text-4xl mb-2">📸</p>
                <p>保存されたノートがありません。「新規ノート」から作成してください。</p>
            </div>
        </section>

        <section id="screenEdit" class="hidden fixed inset-0 bg-black/60 z-20 flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-2xl max-w-4xl w-full max-h-[95vh] flex flex-col overflow-hidden animate-fade-in">
                
                <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                    <input type="text" id="noteTitle" placeholder="ノートのタイトルを入力..." class="text-lg font-bold bg-transparent border-b-2 border-transparent hover:border-slate-300 focus:border-indigo-500 focus:outline-none px-1 py-0.5 w-2/3 transition-all">
                    <span id="noteDate" class="text-xs text-slate-400"></span>
                </div>

                <div class="p-4 md:p-6 overflow-y-auto flex-1 flex flex-col md:flex-row gap-6">
                    
                    <div class="w-full md:w-64 flex flex-col gap-4 shrink-0">
                        
                        <div class="border-2 border-dashed border-slate-300 rounded-xl p-4 text-center hover:border-indigo-400 transition-all bg-slate-50 relative">
                            <input type="file" id="fileInput" accept="image/*, application/pdf" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                            <div class="text-slate-500 text-sm pointer-events-none">
                                <p class="text-2xl mb-1">📁</p>
                                <p class="font-semibold text-indigo-600">画像・PDFを選択</p>
                                <p class="text-xs text-slate-400 mt-1">カメラ / アルバム / ファイル</p>
                            </div>
                        </div>

                        <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">1. 消す（隠す）色の選択</h3>
                            <div class="flex flex-col gap-2">
                                <label class="flex items-center gap-3 p-2 rounded hover:bg-slate-100 cursor-pointer text-sm">
                                    <input type="radio" name="targetColor" value="red" checked class="w-4 h-4 text-red-600">
                                    <span class="w-4 h-4 rounded-full bg-red-500 inline-block"></span>
                                    <span>赤ペンを消す</span>
                                </label>
                                <label class="flex items-center gap-3 p-2 rounded hover:bg-slate-100 cursor-pointer text-sm">
                                    <input type="radio" name="targetColor" value="blue" class="w-4 h-4 text-blue-600">
                                    <span class="w-4 h-4 rounded-full bg-blue-600 inline-block"></span>
                                    <span>青ペンを消す</span>
                                </label>
                                <label class="flex items-center gap-3 p-2 rounded hover:bg-slate-100 cursor-pointer text-sm">
                                    <input type="radio" name="targetColor" value="green" class="w-4 h-4 text-green-600">
                                    <span class="w-4 h-4 rounded-full bg-green-500 inline-block"></span>
                                    <span>緑ペンを消す</span>
                                </label>
                                <label class="flex items-center gap-3 p-2 rounded hover:bg-slate-100 cursor-pointer text-sm">
                                    <input type="radio" name="targetColor" value="none" class="w-4 h-4 text-slate-600">
                                    <span class="w-4 h-4 rounded-full border-2 border-slate-400 inline-block relative">
                                        <span class="absolute inset-0 block w-full h-0.5 bg-slate-400 rotate-45 top-1.5 left-0"></span>
                                    </span>
                                    <span>なにも消さない</span>
                                </label>
                            </div>
                        </div>

                        <div class="bg-indigo-50 text-indigo-800 p-3 rounded-xl text-xs leading-relaxed border border-indigo-100">
                            <p class="font-bold mb-1">💡 使い方ガイド</p>
                            <p>① ファイルを選び、消したい色を指定します。</p>
                            <p>② 指定した色の文字が白く隠れます。</p>
                            <p>③ 消えた部分をタップすると、その文字が一時的に<span class="text-indigo-600 font-bold">再表示</span>されます！</p>
                            <p class="mt-2 text-slate-500">※ 文字が小さい時は、右上のボタンで拡大してスクロールしてください。</p>
                        </div>
                    </div>

                    <div class="flex-1 flex flex-col gap-2">
                        <div id="viewControls" class="hidden flex flex-wrap justify-between items-center bg-slate-200 px-3 py-1.5 rounded-lg text-sm shadow-inner gap-2">
                            <div id="pdfControls" class="hidden flex items-center gap-2">
                                <button id="btnPrevPdf" class="px-2.5 py-1 bg-white rounded shadow hover:bg-slate-50 disabled:opacity-50 font-bold text-slate-700 text-xs">◀ 前ページ</button>
                                <span class="font-medium text-slate-600 text-xs">ページ: <span id="pageNum" class="font-bold text-indigo-600">1</span> / <span id="pageCount">?</span></span>
                                <button id="btnNextPdf" class="px-2.5 py-1 bg-white rounded shadow hover:bg-slate-50 disabled:opacity-50 font-bold text-slate-700 text-xs">次ページ ▶</button>
                            </div>
                            
                            <div class="flex items-center gap-1 bg-slate-300/50 p-1 rounded-md ml-auto">
                                <button id="btnZoomOut" class="px-2 py-0.5 bg-white rounded shadow hover:bg-slate-50 font-bold text-slate-700 text-xs">🔍➖ 縮小</button>
                                <span id="zoomLabel" class="text-xs font-bold text-slate-600 min-w-[50px] text-center">全体</span>
                                <button id="btnZoomIn" class="px-2 py-0.5 bg-white rounded shadow hover:bg-slate-50 font-bold text-slate-700 text-xs">🔍➕ 拡大</button>
                                <button id="btnZoomReset" class="px-2 py-0.5 bg-white rounded shadow hover:bg-slate-50 text-slate-700 text-xs">全体表示</button>
                            </div>
                        </div>

                        <div class="flex-1 min-h-[350px] max-h-[65vh] bg-slate-100 rounded-xl border border-slate-200 overflow-auto p-2 relative flex justify-center items-start">
                            <div id="canvasWrapper" class="canvas-container hidden zoom-fit">
                                <canvas id="originalCanvas"></canvas>
                                <canvas id="maskCanvas"></canvas>
                            </div>
                            <div id="canvasPlaceholder" class="text-slate-400 text-sm text-center my-auto mx-auto">
                                <p class="text-3xl mb-1">🖼️</p>
                                <p>画像やPDFを選択すると表示されます</p>
                            </div>
                        </div>
                    </div>

                </div>

                <div class="p-4 border-t border-slate-100 bg-slate-50 flex justify-between items-center">
                    <button id="btnCancel" class="px-5 py-2 rounded-xl text-sm font-semibold text-slate-500 hover:bg-slate-200 transition-all">
                        キャンセル
                    </button>
                    <button id="btnSave" class="bg-indigo-600 text-white px-6 py-2 rounded-xl text-sm font-bold shadow hover:bg-indigo-700 transition-all">
                        💾 このページを保存
                    </button>
                </div>

            </div>
        </section>

    </main>

    <script>
        // PDF.jsのWorker設定
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // --- 1. ノートモデル（CRUD管理） ---
        class Note {
            constructor(id, imageSrc, maskSrc, title, createdAt, hiddenColors) {
                this.id = id || Date.now();
                this.imageSrc = imageSrc; 
                this.maskSrc = maskSrc;   
                this.title = title || "無題のノート";
                this.createdAt = createdAt || new Date().toLocaleString('ja-JP', { hour12: false });
                this.hiddenColors = hiddenColors || ['red'];
            }

            static getAll() {
                const data = localStorage.getItem('digital_memorize_notes_v4');
                return data ? JSON.parse(data) : [];
            }

            static save(noteInstance) {
                const notes = Note.getAll();
                const idx = notes.findIndex(n => n.id === noteInstance.id);
                if (idx !== -1) {
                    notes[idx] = noteInstance;
                } else {
                    notes.push(noteInstance);
                }
                localStorage.setItem('digital_memorize_notes_v4', JSON.stringify(notes));
            }

            static delete(id) {
                let notes = Note.getAll();
                notes = notes.filter(n => n.id !== id);
                localStorage.setItem('digital_memorize_notes_v4', JSON.stringify(notes));
            }
        }

        // --- 2. 画像処理エンジン（文字抹消＆輪郭膨張処理） ---
        class ImageProcessingEngine {
            static checkColor(r, g, b, targetColor) {
                if (targetColor === 'none') return false;

                if (targetColor === 'red') {
                    return (r > g + 25 && r > b + 25 && r > 60);
                }
                if (targetColor === 'blue') {
                    return (b > r + 25 && b > g + 20 && b > 60);
                }
                if (targetColor === 'green') {
                    return (g > r + 20 && g > b + 15 && g > 60);
                }
                return false;
            }

            static generateMaskCanvas(originalCanvas, targetColor) {
                const width = originalCanvas.width;
                const height = originalCanvas.height;
                
                const maskCanvas = document.createElement('canvas');
                maskCanvas.width = width;
                maskCanvas.height = height;
                
                const origCtx = originalCanvas.getContext('2d');
                const maskCtx = maskCanvas.getContext('2d');
                
                if (targetColor === 'none') return maskCanvas;

                const imgData = origCtx.getImageData(0, 0, width, height);
                const maskImgData = maskCtx.createImageData(width, height);
                
                const src = imgData.data;
                const dst = maskImgData.data;
                
                const hitMap = new Uint8Array(width * height);
                for (let i = 0; i < src.length; i += 4) {
                    const r = src[i];
                    const g = src[i+1];
                    const b = src[i+2];
                    if (this.checkColor(r, g, b, targetColor)) {
                        hitMap[i / 4] = 1;
                    }
                }
                
                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        const idx = y * width + x;
                        let shouldMask = false;
                        
                        for (let dy = -1; dy <= 1; dy++) {
                            for (let dx = -1; dx <= 1; dx++) {
                                const nx = x + dx;
                                const ny = y + dy;
                                if (nx >= 0 && nx < width && ny >= 0 && ny < height) {
                                    if (hitMap[ny * width + nx]) {
                                        shouldMask = true;
                                        break;
                                    }
                                }
                            }
                            if (shouldMask) break;
                        }
                        
                        const dIdx = idx * 4;
                        if (shouldMask) {
                            dst[dIdx] = 255;   
                            dst[dIdx+1] = 255; 
                            dst[dIdx+2] = 255; 
                            dst[dIdx+3] = 255; 
                        } else {
                            dst[dIdx+3] = 0;   
                        }
                    }
                }
                
                maskCtx.putImageData(maskImgData, 0, 0);
                return maskCanvas;
            }

            static toggleMaskAtPoint(maskCanvas, baseMaskCtx, startX, startY) {
                const width = maskCanvas.width;
                const height = maskCanvas.height;
                const maskCtx = maskCanvas.getContext('2d');

                const currentData = maskCtx.getImageData(0, 0, width, height);
                const baseData = baseMaskCtx.getImageData(0, 0, width, height);
                
                const cur = currentData.data;
                const base = baseData.data;
                
                const startIndex = (startY * width + startX) * 4;
                if (base[startIndex + 3] === 0) return false;

                const isCurrentlyHidden = cur[startIndex + 3] > 0;
                const targetAlpha = isCurrentlyHidden ? 0 : 255;

                const queue = [[startX, startY]];
                const visited = new Uint8Array(width * height);
                visited[startY * width + startX] = 1;

                while (queue.length > 0) {
                    const [x, y] = queue.shift();
                    const idx = (y * width + x) * 4;

                    cur[idx] = base[idx];
                    cur[idx+1] = base[idx+1];
                    cur[idx+2] = base[idx+2];
                    cur[idx+3] = targetAlpha;

                    const directions = [[0,1], [0,-1], [1,0], [-1,0]];
                    for (const [dx, dy] of directions) {
                        const nx = x + dx;
                        const ny = y + dy;
                        if (nx >= 0 && nx < width && ny >= 0 && ny < height) {
                            const nidx = (ny * width + nx) * 4;
                            const npos = ny * width + nx;

                            if (!visited[npos] && base[nidx + 3] > 0) {
                                visited[npos] = 1;
                                queue.push([nx, ny]);
                            }
                        }
                    }
                }

                maskCtx.putImageData(currentData, 0, 0);
                return true;
            }
        }

        // --- 3. 画面・UIアプリケーション状態制御 ---
        class AppScreen {
            constructor() {
                this.currentNote = null;
                this.baseMaskCanvas = null; 
                
                // PDF関連の状態
                this.pdfDoc = null;
                this.currentPdfPage = 1;
                this.isRendering = false;

                // ズーム関連の状態
                this.zoomLevel = 1.0;
                this.isZoomFit = true;

                this.initElements();
                this.initEvents();
                this.renderList();
            }

            initElements() {
                this.screenList = document.getElementById('screenList');
                this.screenEdit = document.getElementById('screenEdit');
                this.noteGrid = document.getElementById('noteGrid');
                this.emptyState = document.getElementById('emptyState');
                
                this.btnNewNote = document.getElementById('btnNewNote');
                this.btnCancel = document.getElementById('btnCancel');
                this.btnSave = document.getElementById('btnSave');
                this.fileInput = document.getElementById('fileInput');
                
                this.noteTitle = document.getElementById('noteTitle');
                this.noteDate = document.getElementById('noteDate');
                this.canvasWrapper = document.getElementById('canvasWrapper');
                this.canvasPlaceholder = document.getElementById('canvasPlaceholder');
                
                this.origCanvas = document.getElementById('originalCanvas');
                this.maskCanvas = document.getElementById('maskCanvas');

                // コントロール表示エリア
                this.viewControls = document.getElementById('viewControls');
                this.pdfControls = document.getElementById('pdfControls');
                this.btnPrevPdf = document.getElementById('btnPrevPdf');
                this.btnNextPdf = document.getElementById('btnNextPdf');
                this.pageNumSpan = document.getElementById('pageNum');
                this.pageCountSpan = document.getElementById('pageCount');

                // ズームコントロール要素
                this.btnZoomIn = document.getElementById('btnZoomIn');
                this.btnZoomOut = document.getElementById('btnZoomOut');
                this.btnZoomReset = document.getElementById('btnZoomReset');
                this.zoomLabel = document.getElementById('zoomLabel');
            }

            initEvents() {
                this.btnNewNote.addEventListener('click', () => this.openEditScreen());
                this.btnCancel.addEventListener('click', () => this.closeEditScreen());
                this.btnSave.addEventListener('click', () => this.onSavePressed());
                this.fileInput.addEventListener('change', (e) => this.onFileSelected(e));
                
                document.querySelectorAll('input[name="targetColor"]').forEach(radio => {
                    radio.addEventListener('change', () => this.onColorSelect());
                });
                
                this.maskCanvas.addEventListener('click', (e) => this.onMaskTap(e));

                // PDFページ切り替えイベント
                this.btnPrevPdf.addEventListener('click', () => {
                    if (this.currentPdfPage <= 1) return;
                    this.currentPdfPage--;
                    this.renderPdfPage(this.currentPdfPage);
                });

                this.btnNextPdf.addEventListener('click', () => {
                    if (this.currentPdfPage >= this.pdfDoc.numPages) return;
                    this.currentPdfPage++;
                    this.renderPdfPage(this.currentPdfPage);
                });

                // ズームボタンイベント
                this.btnZoomIn.addEventListener('click', () => this.changeZoom(0.1));
                this.btnZoomOut.addEventListener('click', () => this.changeZoom(-0.1));
                this.btnZoomReset.addEventListener('click', () => this.resetZoom());
            }

            // 💡 ズーム制御処理
            changeZoom(delta) {
                if (this.canvasWrapper.classList.contains('hidden')) return;

                if (this.isZoomFit) {

                    // 全体表示中は縮小できない
                    if (delta < 0) return;

                    this.isZoomFit = false;
                    this.canvasWrapper.classList.remove('zoom-fit');
                    this.canvasWrapper.classList.add('zoom-custom');

                    // 最初の拡大は110%
                    this.zoomLevel = 1.0;
                }

                this.zoomLevel = Math.max(1.0, Math.min(3.0, this.zoomLevel + delta));

                this.applyZoom();
                this.updateZoomButtons();
            }

            resetZoom() {
                this.isZoomFit = false;
                this.zoomLevel = 1.0;
                this.canvasWrapper.classList.remove('zoom-fit');
                this.canvasWrapper.classList.add('zoom-custom');
                
                if (this.zoomLabel) this.zoomLabel.innerText = "100%";
                this.updateZoomButtons();
                this.applyZoom();
            }

            applyZoom() {
                if (this.isZoomFit) return;
                
                // PDF（高精細化で内部サイズ2倍）と 通常画像で基準論理サイズを分岐
                const baseWidth = this.pdfDoc ? (this.origCanvas.width / 2) : this.origCanvas.width;
                const targetWidth = baseWidth * this.zoomLevel;
                
                this.origCanvas.style.width = `${targetWidth}px`;
                this.zoomLabel.innerText = `${Math.round(this.zoomLevel * 100)}%`;
                this.updateZoomButtons();
            }
            updateZoomButtons() {
                if (this.isZoomFit) {
                    this.btnZoomOut.disabled = true;
                    this.btnZoomOut.classList.add("opacity-40", "cursor-not-allowed");
                } else {
                    this.btnZoomOut.disabled = false;
                    this.btnZoomOut.classList.remove("opacity-40", "cursor-not-allowed");
                }
            }

            renderList() {
                const notes = Note.getAll();
                this.noteGrid.innerHTML = '';
                
                if (notes.length === 0) {
                    this.emptyState.classList.remove('hidden');
                    return;
                }
                this.emptyState.classList.add('hidden');

                notes.sort((a,b) => b.id - a.id).forEach(note => {
                    const card = document.createElement('div');
                    card.className = "bg-white rounded-xl shadow border border-slate-100 overflow-hidden hover:shadow-md transition-all flex flex-col";
                    
                    const colorLabel = note.hiddenColors[0] === 'red' ? '赤文字消し' : 
                                       note.hiddenColors[0] === 'blue' ? '青文字消し' : 
                                       note.hiddenColors[0] === 'green' ? '緑文字消し' : 'なにも消さない';

                    card.innerHTML = `
                        <div class="aspect-video bg-slate-100 relative cursor-pointer overflow-hidden group">
                            <img src="${note.imageSrc}" class="w-full h-full object-cover">
                            <img src="${note.maskSrc}" class="w-full h-full object-cover absolute top-0 left-0 opacity-90 group-hover:opacity-50 transition-opacity">
                            <div class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center text-white font-bold text-sm">
                                📖 復習を始める
                            </div>
                        </div>
                        <div class="p-4 flex flex-col justify-between flex-1">
                            <div>
                                <h3 class="font-bold text-slate-800 text-base truncate mb-1">${note.title}</h3>
                                <p class="text-xs text-slate-400">📅 ${note.createdAt}</p>
                            </div>
                            <div class="mt-4 pt-3 border-t border-slate-50 flex justify-between items-center">
                                <span class="text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full font-medium">
                                    🎨 ${colorLabel}
                                </span>
                                <button class="btn-delete text-xs text-red-500 hover:text-red-700 font-semibold px-2 py-1 rounded hover:bg-red-50 transition-all" data-id="${note.id}">
                                    🗑 削除
                                </button>
                            </div>
                        </div>
                    `;
                    
                    card.querySelector('.aspect-video').addEventListener('click', () => this.openEditScreen(note));
                    card.querySelector('.btn-delete').addEventListener('click', (e) => {
                        e.stopPropagation();
                        if(confirm('この暗記ノートを削除しますか？')) {
                            Note.delete(note.id);
                            this.renderList();
                        }
                    });

                    this.noteGrid.appendChild(card);
                });
            }
            

            openEditScreen(note = null) {
                this.screenEdit.classList.remove('hidden');
                document.body.style.overflow = 'hidden';
                this.viewControls.classList.add('hidden');
                this.pdfControls.classList.add('hidden');
                this.pdfDoc = null;
                this.resetZoom();

                if (note) {
                    this.currentNote = new Note(note.id, note.imageSrc, note.maskSrc, note.title, note.createdAt, note.hiddenColors);
                    this.noteTitle.value = this.currentNote.title;
                    this.noteDate.innerText = this.currentNote.createdAt;
                    
                    const color = this.currentNote.hiddenColors[0] || 'red';
                    document.querySelector(`input[name="targetColor"][value="${color}"]`).checked = true;

                    this.displayImageFromSrc(this.currentNote.imageSrc, this.currentNote.maskSrc);
                } else {
                    this.currentNote = new Note();
                    this.noteTitle.value = "新規の暗記ノート";
                    this.noteDate.innerText = new Date().toLocaleString('ja-JP', { hour12: false });
                    document.querySelector(`input[name="targetColor"][value="red"]`).checked = true;
                    this.clearWorkspace();
                }
            }

            closeEditScreen() {
                this.screenEdit.classList.add('hidden');
                document.body.style.overflow = '';
                this.currentNote = null;
                this.baseMaskCanvas = null;
                this.pdfDoc = null;
                this.resetZoom();
            }

            clearWorkspace() {
                this.canvasWrapper.classList.add('hidden');
                this.canvasPlaceholder.classList.remove('hidden');
                this.fileInput.value = '';
                this.viewControls.classList.add('hidden');
                this.pdfControls.classList.add('hidden');
                this.resetZoom();
            }

            onFileSelected(e) {
                const file = e.target.files[0];
                if (!file) return;

                if (file.type === 'application/pdf') {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const typedarray = new Uint8Array(event.target.result);
                        pdfjsLib.getDocument(typedarray).promise.then(pdf => {
                            this.pdfDoc = pdf;
                            this.currentPdfPage = 1;
                            this.pageCountSpan.innerText = pdf.numPages;
                            
                            if(this.noteTitle.value === "新規の暗記ノート") {
                                this.noteTitle.value = file.name.replace('.pdf', '');
                            }

                            this.renderPdfPage(this.currentPdfPage);
                        });
                    };
                    reader.readAsArrayBuffer(file);
                } 
                else if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const img = new Image();
                        img.onload = () => {
                            this.renderImageToCanvas(img);
                        };
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            }

            renderPdfPage(pageNum) {
                if(this.isRendering) return;
                this.isRendering = true;

                this.pageNumSpan.innerText = pageNum;
                this.btnPrevPdf.disabled = pageNum <= 1;
                this.btnNextPdf.disabled = pageNum >= this.pdfDoc.numPages;

                this.pdfDoc.getPage(pageNum).then(page => {
                    const scale = 2.0; // Retina/スマホ向けに解像度を2倍に維持
                    const viewport = page.getViewport({ scale: scale });

                    this.origCanvas.width = viewport.width;
                    this.origCanvas.height = viewport.height;
                    const ctx = this.origCanvas.getContext('2d');

                    const renderContext = {
                        canvasContext: ctx,
                        viewport: viewport
                    };

                    page.render(renderContext).promise.then(() => {
                        this.canvasPlaceholder.classList.add('hidden');
                        this.canvasWrapper.classList.remove('hidden');
                        
                        // コントロール類の表示
                        this.viewControls.classList.remove('hidden');
                        this.pdfControls.classList.remove('hidden');
                        
                        this.onColorSelect(); 
                        
                        // ページ切り替え時に拡大率を維持するかリセットするか
                        if (!this.isZoomFit) {
                            this.applyZoom();
                        } else {
                            this.resetZoom();
                        }
                        this.isRendering = false;
                    });
                });
            }

            renderImageToCanvas(img) {
                const MAX_WIDTH = 1200; 
                let width = img.width;
                let height = img.height;

                if (width > MAX_WIDTH) {
                    height = Math.round((height * MAX_WIDTH) / width);
                    width = MAX_WIDTH;
                }

                this.origCanvas.width = width;
                this.origCanvas.height = height;
                const ctx = this.origCanvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);

                this.canvasPlaceholder.classList.add('hidden');
                this.canvasWrapper.classList.remove('hidden');
                
                this.viewControls.classList.remove('hidden');
                this.pdfControls.classList.add('hidden'); // 画像なのでPDF操作は隠す

                this.onColorSelect();
                this.resetZoom();
            }

            onColorSelect() {
                if (this.canvasWrapper.classList.contains('hidden')) return;

                const targetColor = document.querySelector('input[name="targetColor"]:checked').value;
                this.currentNote.hiddenColors = [targetColor];

                const generatedMask = ImageProcessingEngine.generateMaskCanvas(this.origCanvas, targetColor);
                
                this.maskCanvas.width = generatedMask.width;
                this.maskCanvas.height = generatedMask.height;
                const maskCtx = this.maskCanvas.getContext('2d');
                maskCtx.drawImage(generatedMask, 0, 0);

                this.baseMaskCanvas = document.createElement('canvas');
                this.baseMaskCanvas.width = generatedMask.width;
                this.baseMaskCanvas.height = generatedMask.height;
                this.baseMaskCanvas.getContext('2d').drawImage(generatedMask, 0, 0);
            }

            displayImageFromSrc(imgSrc, maskSrc) {
                const img = new Image();
                img.onload = () => {
                    this.origCanvas.width = img.width;
                    this.origCanvas.height = img.height;
                    this.origCanvas.getContext('2d').drawImage(img, 0, 0);

                    const mask = new Image();
                    mask.onload = () => {
                        this.maskCanvas.width = mask.width;
                        this.maskCanvas.height = mask.height;
                        this.maskCanvas.getContext('2d').drawImage(mask, 0, 0);

                        const targetColor = this.currentNote.hiddenColors[0] || 'red';
                        this.baseMaskCanvas = ImageProcessingEngine.generateMaskCanvas(this.origCanvas, targetColor);

                        this.canvasPlaceholder.classList.add('hidden');
                        this.canvasWrapper.classList.remove('hidden');
                        
                        this.viewControls.classList.remove('hidden');
                        this.pdfControls.classList.add('hidden');
                        this.resetZoom();
                    };
                    mask.src = maskSrc;
                };
                img.src = imgSrc;
            }

            onMaskTap(e) {
                const targetColor = document.querySelector('input[name="targetColor"]:checked').value;
                if (targetColor === 'none') return; 

                const rect = this.maskCanvas.getBoundingClientRect();
                const scaleX = this.maskCanvas.width / rect.width;
                const scaleY = this.maskCanvas.height / rect.height;

                // 💡 拡大されて表示サイズ(rect)が変わっても、これで正しい座標に自動変換されます
                const clickX = Math.floor((e.clientX - rect.left) * scaleX);
                const clickY = Math.floor((e.clientY - rect.top) * scaleY);

                const baseMaskCtx = this.baseMaskCanvas.getContext('2d');

                ImageProcessingEngine.toggleMaskAtPoint(
                    this.maskCanvas, 
                    baseMaskCtx, 
                    clickX, 
                    clickY
                );
            }

            onSavePressed() {
                if (this.canvasWrapper.classList.contains('hidden')) {
                    alert('ファイルが選択されていません。');
                    return;
                }

                let finalTitle = this.noteTitle.value.trim() || "無題のノート";
                if(this.pdfDoc && finalTitle.indexOf('ページ') === -1) {
                     finalTitle += ` (P.${this.currentPdfPage})`;
                }

                this.currentNote.title = finalTitle;
                this.currentNote.imageSrc = this.origCanvas.toDataURL('image/jpeg', 0.85); 
                this.currentNote.maskSrc = this.maskCanvas.toDataURL('image/png');

                Note.save(this.currentNote);

                this.closeEditScreen();
                this.renderList();
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            new AppScreen();
        });
    </script>
</body>
</html>
